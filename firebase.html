<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Devil App 😈</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffb6c1; /* Нежно-розовый фон */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      z-index: 10;
      backdrop-filter: blur(5px);
      width: 320px;
    }
    h2 { color: #333; margin-bottom: 15px; }
    .btn-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }
    .email-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }
    input {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    button {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { transform: scale(1.05); }
    #btn-login { background-color: #24292e; color: white; width: 50%; }
    #btn-google-login { background-color: #4285f4; color: white; width: 50%; }
    #btn-email-login { background-color: #4caf50; color: white; }
    #btn-email-register { background-color: #ff9800; color: white; }
    #btn-logout { background-color: #ff4d4d; color: white; display: none; margin: 0 auto; width: 100%; }
    
    .devil {
      position: absolute;
      bottom: -60px;
      pointer-events: none;
      user-select: none;
      animation: floatUp 6s linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="user-info">Вы не вошли в систему</h2>
    
    <div id="auth-forms">
      <!-- Кнопки OAuth -->
      <div class="btn-container">
        <button id="btn-login">GitHub</button>
        <button id="btn-google-login">Google</button>
      </div>

      <!-- Почта и Пароль -->
      <div class="email-container">
        <input type="email" id="input-email" placeholder="Email">
        <input type="password" id="input-password" placeholder="Пароль">
        <div class="btn-container">
          <button id="btn-email-login" style="width: 50%;">Войти</button>
          <button id="btn-email-register" style="width: 50%;">Регистрация</button>
        </div>
      </div>
    </div>

    <button id="btn-logout">Выйти</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GithubAuthProvider, 
      GoogleAuthProvider, 
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJvlxtk4Lmo1iZvTzgHw7P96tOUggVGOs",
      authDomain: "lalka-2aeab.firebaseapp.com",
      projectId: "lalka-2aeab",
      storageBucket: "lalka-2aeab.firebasestorage.app",
      messagingSenderId: "995940230244",
      appId: "1:995940230244:web:d68a94975f48e044fbab71"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    const githubProvider = new GithubAuthProvider();
    const googleProvider = new GoogleAuthProvider();

    const authForms = document.getElementById("auth-forms");
    const inputEmail = document.getElementById("input-email");
    const inputPassword = document.getElementById("input-password");
    
    const btnLogin = document.getElementById("btn-login");
    const btnGoogleLogin = document.getElementById("btn-google-login");
    const btnEmailLogin = document.getElementById("btn-email-login");
    const btnEmailRegister = document.getElementById("btn-email-register");
    const btnLogout = document.getElementById("btn-logout");
    const userInfo = document.getElementById("user-info");

    // Вход через провайдеров
    btnLogin.addEventListener("click", () => signInWithPopup(auth, githubProvider).catch(err => alert(err.message)));
    btnGoogleLogin.addEventListener("click", () => signInWithPopup(auth, googleProvider).catch(err => alert(err.message)));

    // Вход по почте
    btnEmailLogin.addEventListener("click", () => {
      signInWithEmailAndPassword(auth, inputEmail.value, inputPassword.value)
        .catch(err => alert("Ошибка входа: " + err.message));
    });

    // Регистрация по почте
    btnEmailRegister.addEventListener("click", () => {
      createUserWithEmailAndPassword(auth, inputEmail.value, inputPassword.value)
        .then(() => alert("Вы успешно зарегистрировались!"))
        .catch(err => alert("Ошибка регистрации: " + err.message));
    });

    btnLogout.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        userInfo.textContent = `Привет, ${user.displayName || user.email}! 😈`;
        authForms.style.display = "none";
        btnLogout.style.display = "block";
      } else {
        userInfo.textContent = "Вы не вошли в систему";
        authForms.style.display = "block";
        btnLogout.style.display = "none";
        inputEmail.value = "";
        inputPassword.value = "";
      }
    });

    // Анимация
    function createDevil() {
      const dev = document.createElement('div');
      dev.className = 'devil';
      dev.innerText = '😈';
      dev.style.left = Math.random() * 100 + 'vw';
      dev.style.fontSize = Math.random() * 25 + 20 + 'px';
      dev.style.animationDuration = Math.random() * 4 + 4 + 's';
      document.body.appendChild(dev);
      setTimeout(() => dev.remove(), 8000);
    }
    setInterval(createDevil, 500);
  </script>
</body>
</html>
